name: ci
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
  demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: python -m causallab demo > /tmp/causal-demo.json
      - run: python examples/render_demo.py /tmp/causal-demo.json --check
      - run: python -m causallab query examples/confounded.json --query Y --do X=1
      - run: python -m causallab counterfactual examples/common.json --query Y --evidence X=0,Y=0 --do X=1 --trace
      - run: python -m causallab multiworld-demo > /tmp/multiworld-demo.json
      - run: python examples/render_multiworld.py /tmp/multiworld-demo.json --check
      - run: python -m causallab joint examples/response_flip.json --scenarios examples/scenarios.json --evidence X=0,Y=0 --trace
      - run: python -m causallab bounds-demo > /tmp/bounds-demo.json
      - run: python examples/render_bounds.py /tmp/bounds-demo.json --check
      - run: python -m causallab bounds --p0 .25 --p1 .75 --monotone
      - run: python -m causallab graph-demo > /tmp/graph-demo.json
      - run: python examples/render_graph.py /tmp/graph-demo.json --check
      - run: python -m causallab dsep examples/collider_graph.json --x X --y Y --given D
