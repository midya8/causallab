[metadata]
name = causallab
version = 0.1.0
description = Exact finite structural causal models with observation/intervention/counterfactual audits
license = MIT
license_file = LICENSE

[options]
packages = find:
python_requires = >=3.10

[options.packages.find]
include = causallab*

[options.entry_points]
console_scripts =
    causallab = causallab.__main__:main
